services:
  db:
    image: postgres:16-alpine
    container_name: veyra-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veyra_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-veyraflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veyra} -d ${POSTGRES_DB:-veyraflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  cloud-api:
    build:
      context: ./server/cloud-api
      dockerfile: Dockerfile
    container_name: veyra-cloud-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
      DB_DSN: postgres://${POSTGRES_USER:-veyra}:${POSTGRES_PASSWORD:-veyra_dev_password}@db:5432/${POSTGRES_DB:-veyraflow}?sslmode=disable
      BLOCK_STORE_DIR: ${BLOCK_STORE_DIR:-/var/lib/veyra/blocks}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-veyra-dev-secret-change-me}
      AUTH_TOKEN_LIFETIME_MINUTES: ${AUTH_TOKEN_LIFETIME_MINUTES:-1440}
    ports:
      - "8080:8080"
    volumes:
      - cloud-blocks:/var/lib/veyra/blocks

  seq:
    image: datalust/seq:2024.1
    container_name: veyra-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_LOGLEVEL=Verbose
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  pgdata:
  cloud-blocks:
  seq-data:
