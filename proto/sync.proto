syntax = "proto3";

package veyra.sync;

option go_package = "github.com/V-Serghei/VeyraFlow/tools/sync-agent/pb";

service SyncService {
  rpc SyncFile(SyncFileRequest) returns (SyncFileResponse);
  rpc GetStatus(StatusRequest) returns (StatusResponse);
}

message SyncFileRequest {
  string file_path = 1;
  bytes content_hash = 2;
  int64 file_size = 3;
}

message SyncFileResponse {
  bool success = 1;
  string message = 2;
}

message StatusRequest {
  string client_id = 1;
}

message StatusResponse {
  bool online = 1;
  int64 files_synced = 2;
  int64 last_sync_time = 3;
}
